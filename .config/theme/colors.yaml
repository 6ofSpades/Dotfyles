  TitleBar.text.normal.color: $colors.fg
  TitleBar.text.focus.color: white

  ComboBox.text.press.color: white_bright

  Menu.text.normal.color: $colors.fg

  GroupBox.text.normal.color: $colors.fg
  GroupBox.text.focus.color: white
