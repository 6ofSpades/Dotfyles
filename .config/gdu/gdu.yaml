style:
  footer:
    text-color: white
    background-color: transparent
    number-color: red
  selected-row:
    text-color: ""
    background-color: "#690086"
  result-row:
    number-color: purple
    directory-color: blue
  header:
    text-color: white
    background-color: transparent
    hidden: false
  progress-modal:
    current-item-path-max-len: 0
  use-old-size-bar: true

sorting:
  by: ""
  order: ""
log-file: /dev/null
input-file: ""
output-file: ""
ignore-from-file: ""
storage-path: /tmp/badger
ignore-dirs:
  - /proc
  - /dev
  - /sys
  - /run
ignore-dir-patterns: []
max-cores: 12
top: 0
sequential-scanning: false
show-apparent-size: false
show-relative-size: false
show-annexed-size: false
show-item-count: false
show-mtime: false
no-color: false
mouse: false
non-interactive: false
no-progress: false
no-unicode: false
no-cross: false
no-hidden: false
no-delete: false
no-spawn-shell: false
follow-symlinks: true
profiling: false
const-gc: false
use-storage: false
read-from-storage: false
summarize: false
use-si-prefix: false
no-prefix: false
reverse-sort: false
change-cwd: false
delete-in-background: false
delete-in-parallel: false
