[ui]
key_separator = "·"
activity_limit = 4000
recent_seconds = 3600
timezone = "local"  # you can set something like "America/Sao_Paulo"
country_flags = "auto"

[colors]
normal = ["#c0caf5", "#000000"]
accent = ["#6910a5", "#000000"]
muted = ["#414a74", "#000000"]
blocked = ["#cc00fc", "#000000"]
selected = ["#ffffff", "#290355"]
confirm = ["#000000", "#e0af68"]
details = ["#c0caf5", "#000000"]
details_title = ["#c0caf5", "#000000"]
details_hint = ["#414a74", "#000000"]
error = ["#cc00fc", "#000000"]
key = ["#00ffff", "#000000"]
key_description = ["#414a74", "#000000"]
key_separator = ["#303aff", "#000000"]
filter = ["#303aff", "#000000"]
no_matches = ["#414a74", "#000000"]
tab = ["#c0caf5", "#000000"]
tab_bracket = ["#303aff", "#000000"]
tab_selected = ["#6910a5", "#000000"]
activity_allowed = ["#00bf97", "#000000"]
activity_blocked = ["#cc00fc", "#000000"]
activity_unknown = ["#e0af68", "#000000"]
activity_header = ["#303aff", "#000000"]
activity_filter_error = ["#cc00fc", "#000000"]
unblocked = ["#00bf97", "#000000"]
activity_detail_key = ["#303aff", "#000000"]
activity_detail_value = ["#c0caf5", "#000000"]
overridden = ["#00ffff", "#000000"]

[keys]
quit = ["q"]
next_tab = ["Tab", "Alt+l"]
previous_tab = ["Alt+h"]
down = ["Down", "j"]
up = ["Up", "k"]
search = ["/"]
clear_filter = ["Escape"]
refresh = ["r"]
block = ["b"]
unblock = ["u"]
confirm = ["y"]
cancel = ["n", "Escape"]
finish_search = ["Enter", "Escape"]
backspace = ["Backspace"]
delete_word = ["Ctrl+w"]
details_down = ["J"]
details_up = ["K"]
editor_open = ["Enter"]
editor_back = ["Escape"]
editor_review = ["s"]
editor_reset = ["r"]
activity_pause = ["Space"]
activity_half_down = ["Ctrl+d"]
activity_half_up = ["Ctrl+u"]
activity_top = ["g"]
activity_bottom = ["G"]
activity_redraw = ["Ctrl+l"]
editor_preview = ["p"]
editor_inherit = ["i"]
rules_empty = ["c"]
rule_add = ["a"]
rule_edit = ["e"]
rule_delete = ["d"]
rule_up = ["K"]
rule_down = ["J"]
