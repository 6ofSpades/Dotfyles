# Don't print a new line at the start of the prompt
add_newline = true
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓  🭈🭆🭂  🭞🭜🭘
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
$username$hostname$directory $git_branch $git_commit $git_state $git_status $fill $character
[🭧🭒](bold fg:#3d0861)[ ➜ ](bold bg:#3d0861 fg:white)[](bold fg:#3d0861)
"""

# move the rest of the prompt to the right
right_format = """$cmd_duration"""

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[🬳🬥🬖🬶](bold fg:#5f00d7)[ ✔ ](bold bg:#5f00d7 fg:green)[🬥🬖🬧🬤](bold fg:#5f00d7)"
error_symbol = "[🬳🬥🬖🬶](bold fg:#5f00d7)[ ✘ ](bold bg:#5f00d7 fg:#ff0000)[🬥🬖🬧🬤](bold fg:#5f00d7)"
vimcmd_symbol = "[🬳🬥🬖🬶](bold fg:blue)[ VI ](bold italic bg:blue fg:white)[🬥🬖🬧🬤](bold fg:blue)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[username]
style_root = "red bold"
format = "[🭃](bold fg:#3d0861)[$user](bold italic fg:white bg:#3d0861)[🭞🭜🭘](bold fg:#3d0861 bg:#55007c)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format =  "[$hostname](bg:#55007c bold italic fg:white)[🭞🭜🭘](bold fg:#55007c bg:#6f00a2)"
trim_at = ".companyname.com"
disabled = false

[directory]
home_symbol = " ~"
read_only = " "
truncation_length = 4
truncation_symbol = "•/"
format = '[$path](bg:#6f00a2 bold italic fg:white)[🭞](bg:black bold fg:#6f00a2)'

[directory.substitutions]
"Desktop" = " "
"Documents" = " "
"Downloads" = " "
"Music" = "󰎈 "
"Pictures" = " "
"Videos" = " "
"GitHub" = "󰊤 "
"Games" = "󰺷 "

[git_branch]
style = "bg: cyan"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "[$symbol $branch(:$remote_branch)](fg:green)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state($progress_current of $progress_total)\)]($style)'
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳"
ahead = " 🏎💨"
behind = " 😰"
diverged = " 😵"
untracked = " 🤷"
stashed = " 📦"
modified = "  "
staged = '[++\($count\)](green)'
renamed = " ✍️"
deleted = "  "
format = "[$all_status$ahead_behind](fg:yellow)"


[cmd_duration]
# min_time = 1
format = '[▞🬳🬖🬶](bold fg:#5f00d7)[  $duration ](bold bg:#5f00d7 fg:white)[🬥🬖▓▒](bold fg:#5f00d7)'

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

