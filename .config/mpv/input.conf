# Seeking
h no-osd seek -5
l no-osd seek 5
H no-osd seek -60
L no-osd seek 60

# Seeking in percentage
0 no-osd seek 0 absolute-percent
1 no-osd seek 10 absolute-percent
2 no-osd seek 20 absolute-percent
3 no-osd seek 30 absolute-percent
4 no-osd seek 40 absolute-percent
5 no-osd seek 50 absolute-percent
6 no-osd seek 60 absolute-percent
7 no-osd seek 70 absolute-percent
8 no-osd seek 80 absolute-percent
9 no-osd seek 90 absolute-percent

# looping
# loop current file
r cycle-values loop-file no inf
# loop current playlist
R cycle-values loop-playlist no inf

# Frame stepping
, frame-back-step
. frame-step

# chapter seeking
Ctrl+h no-osd add chapter -1
Ctrl+l no-osd add chapter 1

# Volume
j no-osd add volume -5
k no-osd add volume 5

# cycle through audio tracks
# a cycle audio ; show-text "Audio: ${aid}"
a cycle audio

# cycle through subtitles/captions
c cycle sub-visibility
C cycle sub

# subtitles delay
# sometimes subtitles are out of sync
# this could be useful some day
z add sub-delay -0.1
x add sub-delay 0.1

# audio delay
# less common but still useful for some day
[ add audio-delay -0.1
] add audio-delay 0.1

# Playback speed
Ctrl+, add speed -0.1
Ctrl+. add speed 0.1
Ctrl+0 set speed 1.0

# playlist move
N playlist-next
P playlist-prev

# stats display
i script-binding stats/display-stats-toggle

# screenshot
s screenshot
S screenshot window

# Pause
space cycle pause

# Fullscreen
F cycle fullscreen

# Quit
q quit
