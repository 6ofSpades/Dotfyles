
################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = HDMI-A-1, preferred, auto, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$browser = zen-browser
$fileManager = $terminal yazi
$print = flameshot gui
$hyprscripts = $HOME/.config/hypr/scripts


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = nm-applet &
exec-once = protonvpn-app
exec-once = awww-daemon
exec-once = waybar & dunst & hyprsunset & hypridle & hyprpm reload
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch clipvault store --max-entries 200 --max-entry-age 2d # stores text, image and any other binary data
exec-once = wl-paste --type image --watch clipvault store --max-entries 200 --max-entry-age 2d # stores text, image and any other binary data
exec-once = signal-desktop --start-in-tray & vesktop --ozone-platform-hint=auto & flameshot & solaar -w hide  # you can use --start-minimized for vesktop
exec-once = playerctld # If playerctld is running, Playerctl will act on players in order of their last activity - from the playerctl github

exec-once = [workspace 2 silent] $browser
exec-once = portmaster #portmaster is running on startup with the service, this is just the ui
exec-once = sleep 10 && youtube-music # wait a bit so the VPN connects first

## Scripts:
# exec-once = ~/.local/bin/dolphin-context-fix
exec-once = $hyprscripts/startup

# For the annoying theme things
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface gtk-theme "Breeze-Dark" # for GTK3 apps


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = QT_QPA_PLATFORMTHEME, qt6ct # for Qt apps
#env = QT_STYLE_OVERRIDE, kvantum
env = GTK_THEME, Breeze-Dark # For some reason, some apps don't get themed without this env var

# env = BAT_THEME,base16

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Sweet-cursors
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Sweet-cursors

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xbc
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
# This is important for Dolphin to show items in the "open with" menu
env = XDG_MENU_PREFIX,arch-

## Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = MOZ_DISABLE_RDD_SANDBOX,1
env = __GL_VRR_ALLOWED, 0

env = SDL_VIDEODRIVER,wayland


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

ecosystem {
  enforce_permissions = 1
}

permission = /usr/(bin|local/bin)/grim,       screencopy, allow
permission = /usr/(bin|local/bin)/hyprlock,   screencopy, allow
permission = /usr/(bin|local/bin)/hyprpicker, screencopy, allow
permission = /usr/(bin|loca/bin)/wl-kbptr,    screencopy, allow  # wl-kbptr permission to activate floating auto-detection mode
permission = /usr/(bin|local/bin)/hyprpm,     plugin,     allow

permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, ask

## Apps that shouldn't be shown when sharing screen
# This is from the windows category but it's here cause it's related to permissions and security
windowrule = no_screen_share 1, match:class signal
windowrule = no_screen_share 1, match:class Tor Browser


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 12

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(aa00ffee) rgba(aa00ffee) rgba(0800ffee) rgba(00f7ffee) 90deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 4

        vibrancy = 0.1696

        popups = true
        input_methods = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = nelson,         0.05, 0.9,  0.1,  1.05

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,                ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,              1,     3,     default
    animation = border,              1,     5.39,  easeOutQuint
    animation = windows,             1,     4.79,  easeOutQuint,  slide
    animation = windowsIn,           1,     5.1,   easeOutQuint,  slide
    animation = windowsOut,          1,     2.49,  linear,        popin 27%
    animation = fadeIn,              1,     1.73,  almostLinear
    animation = fadeOut,             1,     1.46,  almostLinear
    animation = fade,                1,     3.03,  quick
    animation = layers,              1,     3.81,  easeOutQuint,  slide
    animation = fadeLayersIn,        1,     1.79,  almostLinear
    animation = fadeLayersOut,       1,     1.39,  almostLinear
    animation = workspacesIn,        1,     3.21,  easeOutQuint,  slide
    animation = workspacesOut,       1,     3.94,  easeOutQuint,  slide
    animation = specialWorkspaceIn,  1,     8,     default,       fade
    animation = specialWorkspaceOut, 1,     3,     default,       fade
    animation = zoomFactor,          1,     7,     quick

    animation = layersIn,            1,     4.5,   nelson,       popin
    animation = layersOut,           1,     3,     nelson,       popin

    # animation = windowsMove,   1,     4,     default,       popin 27%
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
    mfact = 0.5
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    session_lock_xray = true   # This makes the Hyprlock screen transparent
    allow_session_lock_restore = false

    # If a window is on workspace 6, it should be unfocused with 60 fps
    render_unfocused_fps = 60
}

binds {
    workspace_center_on = 1

    # If enabled, apps that request keybinds to be disabled (e.g. VMs) will not be able to do so.
    disable_keybind_grabbing = true
}

cursor {
    # hide the cursor after 10 seconds of inactivity
    inactive_timeout = 10
    warp_on_change_workspace = 2
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = br, us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # no mouse acceleration
    accel_profile = flat

    # should enable scrolling with middle mouse button
    scroll_method = on_button_down
    scroll_button = 274

    touchpad {
        natural_scroll = false
    }
}

device {
    name = ydotoold-virtual-device
    kb_layout = us
    kb_variant =
    kb_options =
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
source = ~/.config/hypr/modules/keybindings.conf


##############################
### WINDOWS AND WORKSPACES ###
##############################
source = ~/.config/hypr/modules/windowrules.conf


###############
### PLUGINS ###
###############

plugin:darkwindow {
  # To modify the uniforms of an already existing shader, create a new shader and set the uniforms you want
  shader[tintRed] {
      from = tint
      args = tintColor=[1 0 0] tintStrength=0.1
  }

  # Use a custom shader from a file, check out ./src/WindowShader.cpp:7 to see examples for the files content
  shader[cool] {
      path = /path/to/shader.glsl
      args = wow=[1.0 0 0]
      introduces_transparency = true # if you modify the alpha value make sure to set this value to true so hyprland knows it should enable blur
  }
  shader[steam] {
      from = chromakey
      args = bkg=[.200 .200 .200] similarity=0.3
  }
}

# Then to apply the shader to a window you can use window rules
#windowrule = plugin:shadewindow chromakey bkg=[.200 .200 .200] similarity=[0.01] amount=[1] targetOpacity=[0.5], match:class steam
## Uniforms can also be passed on the fly, but make sure to not use commas inside the arrays

# Or use a dispatcher
#bind = $mainMod, T, darkwindow:shadeactive, tint tintColor=[0 0.5 1] tintStrength=0.3
# There is also a `darkwindow:shade WINDOW_REGEX SHADER_NAME` available (see window in https://wiki.hypr.land/Configuring/Dispatchers/#parameter-explanation)


plugin:dynamic-cursors {

    # enables the plugin
    enabled = true

    # sets the cursor behaviour, supports these values:
    # tilt    - tilt the cursor based on x-velocity
    # rotate  - rotate the cursor based on movement direction
    # stretch - stretch the cursor shape based on direction and velocity
    # none    - do not change the cursors behaviour
    mode = tilt

    # minimum angle difference in degrees after which the shape is changed
    # smaller values are smoother, but more expensive for hw cursors
    threshold = 2

    # override the mode behaviour per shape
    # this is a keyword and can be repeated many times
    # by default, there are no rules added
    # see the dedicated `shape rules` section below!

    # for mode = rotate
    rotate {

        # length in px of the simulated stick used to rotate the cursor
        # most realistic if this is your actual cursor size
        length = 20

        # clockwise offset applied to the angle in degrees
        # this will apply to ALL shapes
        offset = 0.0
    }

    # for mode = tilt
    tilt {

        # controls how powerful the tilt is, the lower, the more power
        # this value controls at which speed (px/s) the full tilt is reached
        # the full tilt being 60° in both directions
        limit = 5000

        # relationship between speed and tilt, supports these values:
        # linear             - a linear function is used
        # quadratic          - a quadratic function is used (most realistic to actual air drag)
        # negative_quadratic - negative version of the quadratic one, feels more aggressive
        # see `activation` in `src/mode/utils.cpp` for how exactly the calculation is done
        function = negative_quadratic

        # time window (ms) over which the speed is calculated
        # higher values will make slow motions smoother but more delayed
        window = 100
    }

    # for mode = stretch
    stretch {

        # controls how much the cursor is stretched
        # this value controls at which speed (px/s) the full stretch is reached
        # the full stretch being twice the original length
        limit = 3000

        # relationship between speed and stretch amount, supports these values:
        # linear             - a linear function is used
        # quadratic          - a quadratic function is used
        # negative_quadratic - negative version of the quadratic one, feels more aggressive
        # see `activation` in `src/mode/utils.cpp` for how exactly the calculation is done
        function = quadratic

        # time window (ms) over which the speed is calculated
        # higher values will make slow motions smoother but more delayed
        window = 100
    }

    # configure shake to find
    # magnifies the cursor if its is being shaken
    shake {

        # enables shake to find
        enabled = true

        # use nearest-neighbour (pixelated) scaling when shaking
        # may look weird when effects are enabled
        nearest = false

        # controls how soon a shake is detected
        # lower values mean sooner
        threshold = 7.0

        # magnification level immediately after shake start
        base = 4.0
        # magnification increase per second when continuing to shake
        speed = 4.0
        # how much the speed is influenced by the current shake intensitiy
        influence = 0.0

        # maximal magnification the cursor can reach
        # values below 1 disable the limit (e.g. 0)
        limit = 0.0

        # time in millseconds the cursor will stay magnified after a shake has ended
        timeout = 2000

        # show cursor behaviour `tilt`, `rotate`, etc. while shaking
        effects = false

        # enable ipc events for shake
        # see the `ipc` section below
        ipc = false
    }

    # use hyprcursor to get a higher resolution texture when the cursor is magnified
    # see the `hyprcursor` section below
    hyprcursor {

        # use nearest-neighbour (pixelated) scaling when magnifing beyond texture size
        # this will also have effect without hyprcursor support being enabled
        # 0 / false - never use pixelated scaling
        # 1 / true  - use pixelated when no highres image
        # 2         - always use pixleated scaling
        nearest = 1

        # enable dedicated hyprcursor support
        enabled = true

        # resolution in pixels to load the magnified shapes at
        # be warned that loading a very high-resolution image will take a long time and might impact memory consumption
        # -1 means we use [normal cursor size] * [shake:base option]
        resolution = -1

        # shape to use when clientside cursors are being magnified
        # see the shape-name property of shape rules for possible names
        # specifying clientside will use the actual shape, but will be pixelated
        fallback = clientside
    }
}


plugin {
    hyprtrails {
        color = rgba(69008580)
    }
}

plugin {
    hyprscrolling {
        column_width = 0.9
        fullscreen_on_one_column = false
    }
}
