##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*
windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
# --

# -- opacity --
windowrule = opacity 0.99, match:class ^(obsidian)$  # This makes obsidian work with blur, for some reason
windowrule = opacity 0.85, match:class ^(com.obsproject.Studio)$ # OBS
windowrule = opacity 0.9,  match:class ^(com.azefsw-audioconnect-desktop-app-MainKt)$  # Audiorelay
windowrule = opacity 0.8,  match:class ^(com.github.th_ch.youtube_music)$  # pear-desktop
windowrule = opacity 0.8,  match:class ^(spotify)$ 
windowrule = opacity 0.85, match:class portmaster
windowrule = opacity 0.85, match:class [sS]team
windowrule = opacity 0.85, match:initial_title [sS]team  # steam update window
windowrule = opacity 0.8,  match:class syncthingtray
windowrule = opacity 0.85, match:class com.github.wwmm.easyeffects
windowrule = opacity 0.85, match:class signal
windowrule = opacity 0.85, match:class org.telegram.desktop

# -- floating, size, center --
windowrule = float 1,                                match:initial_title termfilechooser
windowrule = size (monitor_w*0.65) (monitor_h*0.65), match:initial_title termfilechooser
windowrule = float 1,                                match:class nvim-wl-anywhere
windowrule = size (monitor_w*0.30) (monitor_h*0.35), match:class nvim-wl-anywhere
windowrule = float 1,                                match:class protonvpn-app
windowrule = center 1,                               match:class protonvpn-app
windowrule = float 1,                                match:class gimp
windowrule = float 1,                                match:class org.qbittorrent.qBittorrent
windowrule = float 1,                                match:initial_title Gamescope WSI Layer Error
windowrule = float 1,                                match:class org.kde.kdenlive

# -- workspaces --
windowrule = workspace 2,                          match:class zen
windowrule = workspace 4 silent,                   match:class vesktop
windowrule = workspace 4,                          match:class signal
windowrule = workspace 6,                          match:class virt-manager
windowrule = workspace 7 silent,                   match:class [sS]team
windowrule = workspace 7 silent,                   match:initial_title [sS]team
windowrule = workspace 10,                         match:class net.lutris.Lutris
windowrule = workspace 10 silent,                  match:class steam_app_default
windowrule = workspace 10 silent,                  match:class gamescope
windowrule = workspace 10,                         match:content 3 # windows with content type "game"
windowrule = workspace 3 silent,                   match:initial_title ^(qBittorrent)$
windowrule = workspace special:magic silent,       match:class solaar
windowrule = workspace special:music silent,       match:class com.github.th_ch.youtube_music
windowrule = workspace special:portmaster silent,  match:class portmaster

# -- blur --
windowrule = no_blur 1, match:class steam_app_default
windowrule = no_blur 1, match:class gamescope

# -- workspace rules --
workspace = special:magic, gapsout:25

# -- special overrides --
# tearing and render_unfocused
windowrule = immediate 1, match:workspace 10
windowrule = render_unfocused 1, match:workspace 10

# picture-in-picture
windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture)$

    float = true
    pin = true
    no_initial_focus = true
    keep_aspect_ratio = true
    move = (monitor_w-window_w-2) (monitor_h-window_h-2)
}
# flameshot pinned image
windowrule {
    name = flameshot-pin
    match:title = ^(flameshot-pin)$

    float = true
    pin = true
    center = true
    size = (window_w*1) (window_h*1)
}
# flameshot window when screenshotting
windowrule {
    name = flameshot-window
    match:title = ^(flameshot)$

    center = true
    animation = gnomed
    stay_focused = true
    workspace = special:flameshot
}

windowrule {
    name = tray-tui
    match:class = tray-tui

    float = 1
    size = (monitor_w*0.6) (monitor_h*0.7)
    center = 1
    stay_focused = 1
}
windowrule {
    name = wiremix
    match:class = wiremix

    float = 1
    size = (monitor_w*0.35) (monitor_h*0.35)
    move = (monitor_w*0.5-window_w/2) (monitor_h-window_h-2)
    stay_focused = 1
}
windowrule {
    name = quick-notes
    match:class = quick-notes

    float = 1
    move = (monitor_w*0.25) (monitor_h-window_h-2)
    size = (monitor_w*0.5) (monitor_h*0.64)
}

# -- layerrules --
layerrule = blur 1, match:namespace waybar
layerrule = blur_popups 1, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar

# dunst, mako, etc
layerrule = blur 1, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications # This avoid having buggy borders when using blur
layerrule = animation slide, match:namespace notifications # cool slide animation :O

layerrule = blur 1, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi

# wlogout
layerrule = blur 1, match:namespace logout_dialog
layerrule = animation fade, match:namespace logout_dialog
layerrule = xray 1, match:namespace logout_dialog

layerrule = blur 1, match:namespace quickshell
layerrule = ignore_alpha 0, match:namespace quickshell
layerrule = animation slide, match:namespace quickshell

layerrule = no_anim 1, match:namespace hyprpicker

# wl-kbptr
layerrule = animation fade, match:namespace selection

# wvkbd virtual keyboard
layerrule = blur 1, match:namespace wvkbd
