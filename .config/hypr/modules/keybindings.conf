###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more

# wlogout
bind = $mainMod, Escape, exec, pkill wlogout || wlogout

bindu = $mainMod,      T, exec, $terminal
bindu = $mainMod SHIFT,T, exec, [float; size (monitor_w*0.5) (monitor_h*0.5); center 1] $terminal
bindu = $mainMod,      B, exec, $browser
bindu = $mainMod,      E, exec, $fileManager
bindu = $mainMod,      Y, exec, pkill tray-tui || $hyprscripts/open-and-focus "footclient -a tray-tui tray-tui" "tray-tui"
bindu = $mainMod SHIFT,M, exec, pkill wiremix || $hyprscripts/open-and-focus "footclient -a wiremix wiremix" "wiremix"
bindu = $mainMod CTRL ,N, exec, $hyprscripts/nvim-anywhere


# hyprctl hyprsunset
bindu = $mainMod, F12, exec, hyprctl hyprsunset gamma +10 && notify-send -a Hyprsunset "Gamma:" "$(hyprctl hyprsunset gamma)" -t 2000 -i text-x-script -u low -r 2427
bindu = $mainMod, F11, exec, hyprctl hyprsunset gamma -10 && notify-send -a Hyprsunset "Gamma:" "$(hyprctl hyprsunset gamma)" -t 2000 -i text-x-script -u low -r 2427
bindu = $mainMod SHIFT, F12, exec, hyprctl hyprsunset temperature +100 && notify-send -a Hyprsunset "Temperature:" "$(hyprctl hyprsunset temperature)" -t 2000 -i text-x-script -u low -r 2427
bindu = $mainMod SHIFT, F11, exec, hyprctl hyprsunset temperature -100 && notify-send -a Hyprsunset "Temperature:" "$(hyprctl hyprsunset temperature)" -t 2000 -i text-x-script -u low -r 2427
bindu = $mainMod, F10, exec, killall hyprsunset & sleep 0.2 && hyprsunset # reset hyprsunset

# quick-notes with obsidian/nvim
bind = $mainMod, N, exec, $hyprscripts/quick-notes

# screenshot
bindu =      ,  Print, exec, $hyprscripts/open-and-focus "flameshot gui" "flameshot"
bindu = SHIFT,  Print, exec, $hyprscripts/open-and-focus "flameshot gui --last-region" "flameshot"

# close windows
bindu = $mainMod,      C, killactive
bindu = $mainMod CTRL, C, forcekillactive   # For when a window is not responding

bind = $mainMod, F, togglefloating,
bind = $mainMod, M, fullscreen, 1   # Maximize window
bind = $mainMod, P, exec, hyprctl dispatch pin && paplay $hyprscripts/.pop-alert.mp3
bind = $mainMod, O, layoutmsg, togglesplit # dwindle
bind = $mainMod SHIFT, O, layoutmsg, swapsplit # dwindle
bind = $mainMod SHIFT, F, fullscreen      # Fullscreen window

bind = $mainMod CTRL, W, exec, virsh --connect qemu:///system start "microsoft-sucks" & virt-manager --connect qemu:///system --show-domain-console "microsoft-sucks"

# Rofi
bindu = ALT,          SPACE, exec, pkill rofi || rofi -show drun -icon-theme candy-icons
bindu = ALT,            TAB, exec, pkill rofi || rofi -show window
bind  = $mainMod,     EQUAL, exec, pkill rofi || rofi -rofi-qalc ./build -show "qalc" -automatic-save-to-history -history-length 7 -no-sort
bind  = $mainMod,         V, exec, pkill rofi || rofi -modi clipboard:$HOME/.config/hypr/scripts/clipvault-rofi -show clipboard -show-icons -config $HOME/.config/rofi/clipboard.rasi
bind  = $mainMod,         W, exec, pkill rofi || nice -n 19 ~/.config/hypr/scripts/wp-selector   # Launch with low priority to avoid CPU spikes
bind  = $mainMod,         U, exec, pkill rofi || $hyprscripts/rofi-rbw
bind  = $mainMod,    PERIOD, exec, pkill rofi || rofimoji --hidden-descriptions --skin-tone light --selector-args="-theme ~/.config/rofi/moji.rasi -kb-secondary-copy ''" -f emojis kaomoji $HOME/.config/rofi/custom_mojis.csv --keybinding-copy Ctrl+c --typer wl-ime-type --prompt "🤯🤡🎉 "
bind  = $mainMod, SEMICOLON, exec, pkill rofi || rofi -show run

bindu = $mainMod, COMMA, exec, ( pkill hyprpicker && $hyprscripts/submap-handling ) || ( $hyprscripts/submap-handling MOUSE & sleep 0.1 && hyprpicker -aa && $hyprscripts/submap-handling )

# dunst
bind = $mainMod, Z, exec, dunstctl history-pop
bind = $mainMod, X, exec, dunstctl close
bind = $mainMod, A, exec, pkill rofi || dunstctl action

# Move focus with mainMod + arrow keys
bindu = $mainMod, H, movefocus, l
bindu = $mainMod, L, movefocus, r
bindu = $mainMod, K, movefocus, u
bindu = $mainMod, J, movefocus, d

# To switch between windows in a floating workspace
bindu = $mainMod, Tab, exec, $hyprscripts/cycle-float-tile  # change focus to another window

# For moving the windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, C, centerwindow

# For resizing the windows
# I wanted to bind these to CTRL instead of ALT but my current keyboard is shit -_-
bindeu = $mainMod CTRL, l, resizeactive, 20 0
bindeu = $mainMod CTRL, h, resizeactive, -20 0
bindeu = $mainMod CTRL, k, resizeactive, 0 -20
bindeu = $mainMod CTRL, j, resizeactive, 0 20

# Move/resize windows with mainMod + LMB/RMB and dragging
bindum = $mainMod, mouse:272, movewindow
bindum = $mainMod, mouse:273, resizewindow

# Switch workspaces with mainMod + [0-9]
# Will always try to switch to a tiling window after switching workspace
bindu = $mainMod, 1, exec, $hyprscripts/workspace-switch 1
bindu = $mainMod, 2, exec, $hyprscripts/workspace-switch 2
bindu = $mainMod, 3, exec, $hyprscripts/workspace-switch 3
bindu = $mainMod, 4, exec, $hyprscripts/workspace-switch 4
bindu = $mainMod, 5, exec, $hyprscripts/workspace-switch 5
bindu = $mainMod, 6, exec, $hyprscripts/workspace-switch 6
bindu = $mainMod, 7, exec, $hyprscripts/workspace-switch 7
bindu = $mainMod, 8, exec, $hyprscripts/workspace-switch 8
bindu = $mainMod, 9, exec, $hyprscripts/workspace-switch 9
bindu = $mainMod, 0, exec, $hyprscripts/workspace-switch 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

bind = $mainMod CTRL, M, togglespecialworkspace, music

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Laptop multimedia keys for volume and LCD brightness
bindeul = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeul = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeul = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeul = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeul = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindeul = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindul = , XF86AudioNext,  exec, playerctl next
bindul = , XF86AudioPause, exec, playerctl play-pause
bindul = , XF86AudioPlay,  exec, playerctl play-pause
bindul = , XF86AudioPrev,  exec, playerctl previous

#### Scrolling layout for hyprscrolling plugin
bind = $mainMod, RIGHT, layoutmsg, move +col
bind = $mainMod,  LEFT, layoutmsg, move -col


###############
### SUBMAPS ###
###############

## Making sure we can always get out of the submap with mainmod Esc in case something goes wrong
bindun = $mainMod, ESCAPE, exec, $hyprscripts/submap-handling


##### Start a submap called "MOUSE" and switch to it
bind = $mainMod, I, exec, $hyprscripts/submap-handling MOUSE
submap = MOUSE

# exit the submap with same bind
bind = $mainMod, I, exec, $hyprscripts/submap-handling MOUSE

# reset submap, call wl-kbptr, then enable MOUSE submap again
# f as in find
bindi = , F, exec, hyprctl dispatch submap reset && wl-kbptr               && hyprctl dispatch submap MOUSE && ydotool mousemove -x -1 -y 0 && ydotool mousemove -x +1 -y 0
# g as in go-to
bindi = , G, exec, hyprctl dispatch submap reset && wl-kbptr -o modes=tile && hyprctl dispatch submap MOUSE && ydotool mousemove -x -1 -y 0 && ydotool mousemove -x +1 -y 0
# the last part of the command to move the mouse helps cause wl-kbptr mousemove is kinda buggya sometimes

# move mouse
bindet = , H, exec, ydotool mousemove -x -10 -y   0
bindet = , J, exec, ydotool mousemove -x   0 -y +10
bindet = , K, exec, ydotool mousemove -x   0 -y -10
bindet = , L, exec, ydotool mousemove -x +10 -y   0

bind = , O, exec, ydotool mousemove -a 1920 0 && $hyprscripts/submap-handling # O as in "Out of my way"
bind = , C, exec, ydotool mousemove -a 960 540 # C as in "Center cursor"
bind = , Y, exec, ydotool key 29:1 46:1 46:0 29:0 && ydotool mousemove -a 1920 0 && $hyprscripts/submap-handling # Sencd ctrl+c to copy stuff and reset

bind = ,          M, exec, $hyprscripts/mark-cursor mark
bind = , apostrophe, exec, $hyprscripts/mark-cursor move

# move further
binde = SHIFT, H, exec, ydotool mousemove -x -100 -y    0
binde = SHIFT, J, exec, ydotool mousemove -x    0 -y +100
binde = SHIFT, K, exec, ydotool mousemove -x    0 -y -100
binde = SHIFT, L, exec, ydotool mousemove -x +100 -y    0

# move closer
binde = CTRL, H, exec, ydotool mousemove -x -1 -y  0
binde = CTRL, J, exec, ydotool mousemove -x  0 -y +1
binde = CTRL, K, exec, ydotool mousemove -x  0 -y -1
binde = CTRL, L, exec, ydotool mousemove -x +1 -y  0

# Start a submap called "SCROL" and switch to it while holding tab
# This is like a sub-submap. What happens is that using a mod key for this
# doesn't work very well cause the scroll is a mouse thing, so key inputs to windows
# don't get blocked properly as they should, they kinda "leak".
# Meaaning that "ALT + J" != Simply scroll down, in reality: "ALT + J" == Scroll down while holding ALT
# We're trying to use another submap here to workaround this
bindit = , TAB, submap, SCROL
submap = SCROL

# even with the hacky workaround these scrolling thingys don't work very well
binde = , H, exec, ydotool mousemove -w -- -1  0
binde = , J, exec, ydotool mousemove -w --  0 -1
binde = , K, exec, ydotool mousemove -w --  0  1
binde = , L, exec, ydotool mousemove -w --  1  0

binde = , D, exec, ydotool mousemove -w --  0 -1000
binde = , U, exec, ydotool mousemove -w --  0  1000

bindirt = , TAB, submap, MOUSE
submap = MOUSE

# mouse clicks
#to press with left hand
bind   = , A, exec, ydotool click 40
bindrt = , A, exec, ydotool click 80
#to press with right hand
bind   = , B, exec, ydotool click 40
bindrt = , B, exec, ydotool click 80
# to press with thumb, or reset submap automatically
bind   = , SPACE, exec, ydotool click C0 && ydotool mousemove -a 1920 0 && $hyprscripts/submap-handling
#to toggle instead of having to hold
bind   =      , V, exec, ydotool click 40
bind   = SHIFT, V, exec, ydotool click 80
#right click
bind   = , D, exec, ydotool click 41
bindrt = , D, exec, ydotool click 81
#middle/scroll click
bind   = , S, exec, ydotool click 42
bindrt = , S, exec, ydotool click 82

# resetting the mouse downs just in case you forget to mouse up manually before changing the submap
bind =         , ESCAPE, exec, ydotool click 80  #just in case you forget to mouse up
bind =              , O, exec, ydotool click 80
bind = CTRL,  SPACE, exec, ydotool click 80

bind = , ESCAPE, exec, $hyprscripts/submap-handling

# Reset the submap, which will return to the global submap
submap = reset


##### Start a submap called "PLCTL" and switch to it
bindu = $mainMod ALT, P, exec, $hyprscripts/submap-handling PLCTL
submap = PLCTL

binde = , H, exec, $hyprscripts/plctl h
binde = , L, exec, $hyprscripts/plctl l
binde = , J, exec, $hyprscripts/plctl j
binde = , K, exec, $hyprscripts/plctl k

bind  = , F, exec, pkill rofi || $hyprscripts/plctl select  # list players
bind  = , TAB, exec, pkill rofi || $hyprscripts/plctl tab  # cycle to next player
bind  = , C, exec,               $hyprscripts/plctl clear && paplay $hyprscripts/.pop-alert.mp3 # clear player selection

bind = SHIFT, L, exec, $hyprscripts/plctl next
bind = SHIFT, H, exec, $hyprscripts/plctl previous

bind = , SPACE, exec, $hyprscripts/plctl play-pause
bind = SHIFT, SPACE, exec, $hyprscripts/plctl play-pause & $hyprscripts/submap-handling

bind = , 0, exec, $hyprscripts/plctl 0%
bind = , 1, exec, $hyprscripts/plctl 10%
bind = , 2, exec, $hyprscripts/plctl 20%
bind = , 3, exec, $hyprscripts/plctl 30%
bind = , 4, exec, $hyprscripts/plctl 40%
bind = , 5, exec, $hyprscripts/plctl 50%
bind = , 6, exec, $hyprscripts/plctl 60%
bind = , 7, exec, $hyprscripts/plctl 70%
bind = , 8, exec, $hyprscripts/plctl 80%
bind = , 9, exec, $hyprscripts/plctl 90%

# Reset the submap, which will return to the global submap
submap = reset


# Start a submap called "MVRSW", as in move/resize-window, and switch to it
bindu = $mainMod ALT, M, exec, $hyprscripts/submap-handling MVRSW
submap = MVRSW

binde = , H, movefocus, l
binde = , J, movefocus, d
binde = , K, movefocus, u
binde = , L, movefocus, r

binde = , Tab, exec, $hyprscripts/cycle-float-tile  # change focus to another window

bind = , C, centerwindow
bind = , F, togglefloating
bind = , M, fullscreen, 1
bind = SHIFT, F, fullscreen

bind =      , S, exec, $hyprscripts/swapwindow
bind = SHIFT, S, exec, $hyprscripts/swapwindow & $hyprscripts/submap-handling

bind  =        ,B, exec, $hyprscripts/mvrsw blur
bind  =  SHIFT, B, exec, $hyprscripts/mvrsw blur-all
binde =    ,EQUAL, exec, $hyprscripts/mvrsw opacityp
binde =    ,MINUS, exec, $hyprscripts/mvrsw opacitym

# move windows
binde = SHIFT, H, moveactive, -25   0
binde = SHIFT, J, moveactive,   0  25
binde = SHIFT, K, moveactive,   0 -25
binde = SHIFT, L, moveactive,  25   0
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# resize windows
binde = CTRL, H, resizeactive, -20 0
binde = CTRL, J, resizeactive, 0 20
binde = CTRL, K, resizeactive, 0 -20
binde = CTRL, L, resizeactive, 20 0

# move in same place
binde = CTRL SHIFT, H, resizeactive, -50   0
binde = CTRL SHIFT, H, moveactive,    25   0
binde = CTRL SHIFT, J, resizeactive,   0  50
binde = CTRL SHIFT, J, moveactive,     0 -25
binde = CTRL SHIFT, K, resizeactive,   0 -50
binde = CTRL SHIFT, K, moveactive,     0  25
binde = CTRL SHIFT, L, resizeactive,  50   0
binde = CTRL SHIFT, L, moveactive,   -25   0

bind = ,  1, movetoworkspacesilent, 1
bind = ,  2, movetoworkspacesilent, 2
bind = ,  3, movetoworkspacesilent, 3
bind = ,  4, movetoworkspacesilent, 4
bind = ,  5, movetoworkspacesilent, 5
bind = ,  6, movetoworkspacesilent, 6
bind = ,  7, movetoworkspacesilent, 7
bind = ,  8, movetoworkspacesilent, 8
bind = ,  9, movetoworkspacesilent, 9
bind = , 10, movetoworkspacesilent, 10
bind = SHIFT,  1, movetoworkspace, 1
bind = SHIFT,  2, movetoworkspace, 2
bind = SHIFT,  3, movetoworkspace, 3
bind = SHIFT,  4, movetoworkspace, 4
bind = SHIFT,  5, movetoworkspace, 5
bind = SHIFT,  6, movetoworkspace, 6
bind = SHIFT,  7, movetoworkspace, 7
bind = SHIFT,  8, movetoworkspace, 8
bind = SHIFT,  9, movetoworkspace, 9
bind = SHIFT, 10, movetoworkspace, 10

# Reset the submap, which will return to the global submap
submap = reset


########################### DYNAMIC SUBMAP ###########################
binditn = , ALT_L, exec, $hyprscripts/dynamic-submaps

submap = DYNAM

# ydotool doesn't work well here, actually it works terribly for some reason
# wlrctl also doesn't cause it doesn't seem to do arrow keys
# this is native to hyprland so should work better anyway
binde = ALT, H, sendshortcut, ,  LEFT, activewindow
binde = ALT, J, sendshortcut, ,  DOWN, activewindow
binde = ALT, K, sendshortcut, ,    UP, activewindow
binde = ALT, L, sendshortcut, , RIGHT, activewindow

binde = ALT, W, exec, hyprctl dispatch sendshortcut CTRL,RIGHT,activewindow && hyprctl dispatch sendshortcut CTRL,RIGHT,activewindow && hyprctl dispatch sendshortcut CTRL,LEFT,activewindow
binde = ALT, B, sendshortcut, CTRL,   LEFT, activewindow
binde = ALT, E, sendshortcut, CTRL,  RIGHT, activewindow
binde = ALT, D, sendshortcut, CTRL, Delete, activewindow
binde = ALT, X, sendshortcut,     , Delete, activewindow

binde = ALT, 0, sendshortcut, , Home, activewindow
binde = ALT SHIFT, I, sendshortcut, , Home, activewindow
binde = ALT SHIFT, 4, sendshortcut, , End, activewindow
binde = ALT SHIFT, A, sendshortcut, , End, activewindow

# for switching tabs on browser. Vimium doesn't work on protected pages
binde = ALT SHIFT, J, sendshortcut, CTRL, Page_Down, activewindow
binde = ALT SHIFT, K, sendshortcut, CTRL, Page_Up, activewindow

# Use `reset` to go back to the global submap
bindirt = , ALT_L, submap, reset

submap = reset
