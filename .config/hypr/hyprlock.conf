# ============================================================================
# Alternative Progress Bar Styles (Commented Out)
# ============================================================================
# These provide different visual styles for the progress bar.
# Uncomment to use instead of the Pango markup version above.

# Style 1: Background bar (full width, static gray)
label {
   monitor = 
   text = ━━━━━━━━━━━━━━━━━━━━━━
   color = $black_bright
   font_size = 12
   font_family = $font
   position = 905, 92
   halign = left
   valign = bottom
   zindex = 1
}

# Style 2: Foreground bar (dynamic width based on progress, overlays on top)
label {
   monitor = 
   text = cmd[update:1000] bash -c 'p=$(~/.config/hypr/scripts/hyprlock-music.sh --progress); chars=$((p*22/100)); printf "━%.0s" $(seq 1 $chars)' # 17/100 cause the bar string is 17 chars long
   color = $accent
   font_size = 12
   font_family = $font
   position = 905, 92
   halign = left
   valign = bottom
   zindex = 2
}

# ------------------------------------

# Keyboard layout
label {
    monitor =
    text =   $LAYOUT[br,us]
    font_family = $font
    font_size = 15
    color = $fg
    onclick = hyprctl switchxkblayout all next

    position = -30, 20
    halign = right
    valign = bottom
}

