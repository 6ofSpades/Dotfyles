# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#
$font = JetBrainsMonoNF
$monitor =
$wallpaper = ~/.config/hypr/.wallpaper_current

source = ~/.config/theme/generated/hyprland.conf


general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = $wallpaper
    color = rgba(0, 0, 0, 0.5)  # fallback if path is empty
    blur_size = 4
    blur_passes = 3
    brightness = 0.5
}

label {
  text = ⁣  ⁣
  position = -4, 430
  font_size = 35
  font_family = $font
  color = $black_bright
}

# USER-BOX
shape {
    monitor =
    size = 18%, 5%
    color = $hyprlock_input_bg
    rounding = 15
    border_size = 2
    border_color = $accent
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -35
    halign = center
    valign = center
    zindex = 0
}

# USER
label {
    monitor =
    text =  $USER
    color = $black_bright
    font_size = 0.25
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 18%, 5%
    outline_thickness = 2

    outer_color = $hyprlock_input_border $hyprlock_input_border_anim 0deg
    check_color = $hyprlock_input_check $hyprlock_input_border 120deg
    fail_color = $hyprlock_input_fail $hyprlock_input_border 40deg
    capslock_color = $hyprlock_input_caps 40deg

    inner_color = $hyprlock_input_bg

    font_color = $fg
    fade_on_empty = false
    rounding = 15

    font_family = $font Italic
    placeholder_text = Enter pass...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = ⁣ ⁣
    dots_size = 0.25
    dots_spacing = 0

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -110
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 120
    font_family = $font Bold
    color = $fg

    position = 0, -150
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%d %B %Y" # update every 60 seconds
    font_size = 30
    font_family = $font Bold
    color = $fg

    position = 0, -357
    halign = center
    valign = top
}

# WEEK
label {
    monitor =
    text = cmd[update:60000] date +"- %A -" # update every 60 seconds
    font_size = 20
    font_family = $font Italic
    color = $fg

    position = 0, -440
    halign = center
    valign = top
}

# HIBERNATE
image {
    monitor =
    path = ~/.config/wlogout/icons/hibernate-colored.png
    size = 75
    border_size = 0
    onclick = systemctl hibernate
    position = -80, 250
    halign = center
    valign = bottom
    zindex = 1
}
# SUSPEND
image {
    monitor =
    path = ~/.config/wlogout/icons/suspend-colored.png
    size = 75
    border_size = 0
    onclick = systemctl suspend
    position = 80, 250
    halign = center 
    valign = bottom
    zindex = 1
}

# ============================================================================
# Music Player Widget
# ============================================================================

# ----------------------------------------------------------------------------
# Album Art
# ----------------------------------------------------------------------------
image {
    monitor =
    # path = ~/.config/hypr/scripts/.music.webp
    size = 100
    rounding = 5
    border_size = 2
    border_color = $white
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/hyprlock-music.sh --art
    position = 730, 57
    halign = left
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Player Background Box
# ----------------------------------------------------------------------------
shape {
    monitor =
    color = $hyprlock_input_bg
    size = 500, 140
    rounding = 10
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 0
}

# ----------------------------------------------------------------------------
# Track Information
# ----------------------------------------------------------------------------

# Song title
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --title)"
    color = $fg
    font_size = 14
    font_family = $font
    position = 55, 138
    halign = center
    valign = bottom
    zindex = 1
}

# Player source (e.g., Spotify, Firefox)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --player)"
    color = $black_bright
    font_size = 12
    font_family = SF Pro Display Bold
    position = 180, 43
    halign = center
    valign = bottom
    text_align = right
    zindex = 1
}

# Artist name
label {
    monitor =
    text = cmd[update:1000] echo "󰠃  $(~/.config/hypr/scripts/hyprlock-music.sh --artist)"
    color = $black_bright
    font_size = 12
    font_family = $font
    position = 55, 115
    halign = center
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Playback Controls
# ----------------------------------------------------------------------------

# Previous track button
label {
    monitor =
    text = 󰒮
    color = $fg
    font_size = 25
    onclick = playerctl previous
    position = -5, 55
    halign = center
    valign = bottom
    zindex = 1
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh --status
    color = $fg
    font_size = 25
    onclick = playerctl play-pause
    position = 55, 55
    halign = center
    valign = bottom
    zindex = 1
}

# Next track button
label {
    monitor =
    text = 󰒭
    color = $fg
    font_size = 25
    onclick = playerctl next
    position = 110, 55
    halign = center
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Progress Display
# ----------------------------------------------------------------------------

# Current position timestamp
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --position)"
    color = $fg
    font_size = 9
    font_family = $font
    position = -90, 95
    halign = center
    valign = bottom
    zindex = 1
}

# Total length timestamp
label {
    monitor = 
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock-music.sh --length)"
    color = $fg
    font_size = 9
    font_family = $font
    position = 200, 95
    halign = center
    valign = bottom
    zindex = 1
}

