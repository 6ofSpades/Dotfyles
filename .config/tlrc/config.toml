[cache]
dir = "~/.cache/tlrc"
mirror = "https://github.com/tldr-pages/tldr/releases/latest/download"
auto_update = true
defer_auto_update = false
max_age = 336
languages = []

[output]
show_title = true
platform_title = false
show_hyphens = false
example_prefix = "- "
line_length = 0
compact = false
option_style = "long"
raw_markdown = false

[indent]
title = 2
description = 2
bullet = 2
example = 4

[style.title]
color = {hex = "#ffffff"}
background = {hex = "#6910a5"}
bold = true
underline = false
italic = false
dim = false
strikethrough = false

[style.description]
color = {hex = "#414a74"}
background = "default"
bold = false
underline = false
italic = false
dim = false
strikethrough = false

[style.bullet]
color = {hex = "#8500bc"}
background = "default"
bold = true
underline = false
italic = false
dim = false
strikethrough = false

[style.example]
color = {hex = "#c0caf5"}
background = "default"
bold = false
underline = false
italic = false
dim = false
strikethrough = false

[style.url]
color = {hex = "#00ffff"}
background = "default"
bold = false
underline = true
italic = true
dim = false
strikethrough = false

[style.inline_code]
color = {hex = "#303aff"}
background = "default"
bold = false
underline = false
italic = true
dim = false
strikethrough = false

[style.placeholder]
color = {hex = "#303aff"}
background = "default"
bold = false
underline = false
italic = true
dim = false
strikethrough = false
